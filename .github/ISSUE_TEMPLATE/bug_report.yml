name: Bug report
description: Something on the game board does not work
labels: ["bug"]
body:
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "Chrome 130 on Windows 11"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what happened, what you expected instead
    validations:
      required: true
